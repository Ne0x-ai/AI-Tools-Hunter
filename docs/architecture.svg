<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="404" viewBox="0 0 1000 404" role="img" aria-labelledby="arch-title arch-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif">
<title id="arch-title">ai-tools-before-launch architecture</title>
<desc id="arch-desc">The start daemon is the sole writer of every ingest table. The serve process reads ingest data and writes only review decisions. Both share a lease queue in SQLite, and a heartbeat row lets the console tell idle apart from not running.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="1000" height="404" rx="12" fill="#ffffff"/>

<rect x="150" y="40" width="660" height="130" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<rect x="151" y="52" width="3" height="106" rx="1.5" fill="#1a7f37"/>
<text x="170" y="62" font-size="13" font-weight="600" fill="#1f2328">start · daemon</text>
<text x="268" y="62" font-size="11" fill="#1a7f37">sole writer of ingest tables</text>

<rect x="40" y="83" width="100" height="50" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="90" y="102" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">CT Logs</text>
<text x="90" y="118" font-size="11" text-anchor="middle" fill="#57606a">RFC 6962</text>

<line x1="142" y1="108" x2="166" y2="108" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>

<rect x="170" y="80" width="120" height="56" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="230" y="101" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">CT Adapter</text>
<text x="230" y="119" font-size="11" text-anchor="middle" fill="#57606a">paged get-entries</text>

<line x1="292" y1="108" x2="316" y2="108" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>

<rect x="320" y="80" width="130" height="56" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="385" y="101" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">First-seen</text>
<text x="385" y="119" font-size="11" text-anchor="middle" fill="#57606a">ct_seen_domains</text>

<line x1="452" y1="108" x2="476" y2="108" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>

<rect x="480" y="80" width="140" height="56" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/>
<text x="550" y="101" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">Lease Queue</text>
<text x="550" y="119" font-size="11" text-anchor="middle" fill="#57606a">ct_discovery_work</text>

<line x1="622" y1="108" x2="646" y2="108" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>

<rect x="650" y="80" width="130" height="56" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="715" y="101" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">Funnel + Probe</text>
<text x="715" y="119" font-size="11" text-anchor="middle" fill="#57606a">S1–S5, rules-only</text>

<path d="M715 138 V176 H510 V190" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="600" y="170" font-size="11" text-anchor="middle" fill="#57606a">evidence</text>

<path d="M735 172 V190" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="745" y="184" font-size="11" fill="#57606a">per cycle</text>

<rect x="420" y="194" width="180" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="510" y="215" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">SQLite</text>
<text x="510" y="233" font-size="11" text-anchor="middle" fill="#57606a">WAL, append-only</text>

<rect x="660" y="194" width="150" height="56" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="735" y="215" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">Heartbeat</text>
<text x="735" y="233" font-size="11" text-anchor="middle" fill="#57606a">daemon_heartbeat</text>

<path d="M440 226 H400 V304" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="410" y="248" font-size="11" fill="#57606a">ingest (read)</text>

<rect x="110" y="274" width="350" height="110" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<rect x="111" y="286" width="3" height="86" rx="1.5" fill="#0969da"/>
<text x="130" y="294" font-size="13" font-weight="600" fill="#1f2328">serve · console</text>
<text x="228" y="294" font-size="11" fill="#0969da">never writes ingest</text>

<rect x="300" y="308" width="130" height="54" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="365" y="328" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">FastAPI</text>
<text x="365" y="345" font-size="11" text-anchor="middle" fill="#57606a">/v1, reads heartbeat</text>

<line x1="298" y1="335" x2="274" y2="335" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>

<rect x="130" y="310" width="140" height="50" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="200" y="329" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">Review Console</text>
<text x="200" y="345" font-size="11" text-anchor="middle" fill="#57606a">Signal Desk</text>
</svg>
