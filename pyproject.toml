[project]
name = "ai-tools-before-launch"
version = "0.1.0"
description = "Find new AI tools before anyone else — by watching Certificate Transparency logs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Neo Xue" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "fastapi>=0.115",
    "publicsuffix2>=2.20191221",
    "uvicorn>=0.30",
    "cryptography>=42",
]

[project.scripts]
ai-tools-before-launch = "ai_tools_before_launch.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[project.urls]
Homepage = "https://github.com/Ne0x-ai/ai-tools-before-launch"
Repository = "https://github.com/Ne0x-ai/ai-tools-before-launch"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Generated data and built frontend assets, not code: a wheel that omits them
# installs cleanly and then fails at runtime. The RDAP table gates domain age,
# and ``create_app`` mounts ``static/assets`` with ``StaticFiles``, which raises
# ``RuntimeError`` when the directory is missing — so a .py-only wheel made
# ``serve`` crash on startup while ``start`` kept working.
[tool.setuptools.package-data]
"ai_tools_before_launch.filter" = ["rdap_bootstrap.json"]
"ai_tools_before_launch" = ["static/index.html", "static/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
